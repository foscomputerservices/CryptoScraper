name: CI

# The package is Swift tools 6.0, language mode 6 on its new libraries, with a floor of 26 on the Apple platforms, so the
# Apple jobs need the macOS 26 SDK: the newest Xcode 26 or 27 the macos-26 runner carries. The platforms list sets Apple floors only; Linux builds with a Swift 6 toolchain.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push supersedes the run in progress on the same ref, which is cancelled; a run the latest push needs is never
# cancelled (the owner's rule of 2026-10-06).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Etherscan's API V2 serves every EVM scanner with one key, ETHER_SCAN_KEY; the four other scanners' keys are no longer
# read.
env:
  COIN_MARKETCAP_KEY: ${{ secrets.COIN_MARKETCAP_KEY }}
  BTC_TEST_CONTRACT_ADDRESS: ${{ secrets.BTC_TEST_CONTRACT_ADDRESS }}
  ETHER_SCAN_KEY: ${{ secrets.ETHER_SCAN_KEY }}
  ETH_TEST_CONTRACT_ADDRESS: ${{ secrets.ETH_TEST_CONTRACT_ADDRESS }}
  FTM_TEST_CONTRACT_ADDRESS: ${{ secrets.FTM_TEST_CONTRACT_ADDRESS }}
  BSC_TEST_CONTRACT_ADDRESS: ${{ secrets.BSC_TEST_CONTRACT_ADDRESS }}
  POLYGON_TEST_CONTRACT_ADDRESS: ${{ secrets.POLYGON_TEST_CONTRACT_ADDRESS }}
  OPTIMISTIC_TEST_CONTRACT_ADDRESS: ${{ secrets.OPTIMISTIC_TEST_CONTRACT_ADDRESS }}
  TRON_TEST_CONTRACT_ADDRESS: ${{ secrets.TRON_TEST_CONTRACT_ADDRESS }}

jobs:
  test_linux:
    name: Test on Ubuntu, Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # The contract tests run first. The behavioral suites, projected from the requirements in an isolated context
      # (step 2's suite names and files carry a key and an underscore, C32_, L17_, Retrieval_, skipped by a word that
      # starts with a capital and runs to an underscore, so a test's unlabeled argument, "(_:)", is never skipped with
      # them; a test's id carries its file's name, so DocCVectorTests, in C2_WellKnownAssets.swift, is skipped with its
      # file; step 3's are the projector's own
      # names, skipped by name: C30ValuesTests, the *ContractTests run by the plug-ins, the signing and key suites, and the
      # four OHLCV conformers' suites), run in their own step second, and gate the build like the contract tests: each
      # classified red is disabled in place with its classification as the reason (recorded in fosline's step-2 and
      # step-3 layer-A ledgers), so what runs is exactly what is expected to pass (the owner's ruling of 2026-10-06).
      - name: Test the libraries' contracts (no network)
        run: swift test --filter "CryptoAssetTests|CryptoAssetLocalizationTests|CryptoExchangeTests|CryptoHyperliquidTests|CryptoKrakenTests|CryptoCoinbaseTests|CryptoOHLCVTests|CryptoReferenceTests|CryptoFearGreedTests" --skip "\\b[A-Z][A-Za-z0-9]*_|C30ValuesTests|HyperliquidContractTests|KrakenContractTests|CoinbaseContractTests|HyperliquidKeyTests|HyperliquidSigningTests\\b|KrakenSigningTests|KrakenMaintenanceTests|CoinbaseSigningTests|\\.BinanceOHLCVClientTests\\b|\\.HyperliquidOHLCVClientTests\\b|\\.KrakenOHLCVClientTests\\b|\\.CoinbaseOHLCVClientTests\\b"

      # The identity PR's re-projection of the 2023 target (Tests/CryptoScraperTests/Behavioral/, its suites named
      # D<n>_…Tests, recorded answers only) runs here and is skipped by the network step, so it runs once.
      - name: Test the libraries' behavioral suites (classified reds disabled in place with their reason)
        run: swift test --filter "CryptoAssetTests|CryptoAssetLocalizationTests|CryptoExchangeTests|CryptoHyperliquidTests|CryptoKrakenTests|CryptoCoinbaseTests|CryptoOHLCVTests|CryptoReferenceTests|CryptoFearGreedTests|CryptoScraperTests\\.D[0-9]+_" --skip-build

      # The no-network suites of the 2023 CryptoScraper target, selected by suite name (every one ends NoNetworkTests),
      # gate the build like the libraries' steps.
      - name: Test the old target's no-network suites
        run: swift test --filter "NoNetworkTests" --skip-build

      # The network suites reach the chains' APIs with the secrets above and do not gate until the aggregators' token
      # counts are done and the Bitcoin explorer's rate limit is met; the Etherscan V2 work is done, and a chain V2
      # refuses to the key's plan, or does not serve, is skipped in V2's words. The no-network suites are skipped here,
      # so they run once.
      - name: Test the old aggregators (network)
        continue-on-error: true
        run: swift test --filter "CryptoScraperTests" --skip "NoNetworkTests|CryptoScraperTests\\.D[0-9]+_"

  test_macos:
    name: Test on macOS 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[67]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 or 27 on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Build
        run: swift build

      # The libraries and their tests need no network: recorded responses only; the exchanges' live reads are opt-in
      # (CRYPTO_EXCHANGE_LIVE=1) and never run here. The old CryptoScraper
      # target's tests reach the chains' APIs with the secrets above and are run separately so a network failure
      # there does not hide a library failure.
      # The contract tests run first. The behavioral suites, projected from the requirements in an isolated context
      # (step 2's suite names and files carry a key and an underscore, C32_, L17_, Retrieval_, skipped by a word that
      # starts with a capital and runs to an underscore, so a test's unlabeled argument, "(_:)", is never skipped with
      # them; a test's id carries its file's name, so DocCVectorTests, in C2_WellKnownAssets.swift, is skipped with its
      # file; step 3's are the projector's own
      # names, skipped by name: C30ValuesTests, the *ContractTests run by the plug-ins, the signing and key suites, and the
      # four OHLCV conformers' suites), run in their own step second, and gate the build like the contract tests: each
      # classified red is disabled in place with its classification as the reason (recorded in fosline's step-2 and
      # step-3 layer-A ledgers), so what runs is exactly what is expected to pass (the owner's ruling of 2026-10-06).
      - name: Test the libraries' contracts (no network)
        run: swift test --filter "CryptoAssetTests|CryptoAssetLocalizationTests|CryptoExchangeTests|CryptoHyperliquidTests|CryptoKrakenTests|CryptoCoinbaseTests|CryptoOHLCVTests|CryptoReferenceTests|CryptoFearGreedTests" --skip "\\b[A-Z][A-Za-z0-9]*_|C30ValuesTests|HyperliquidContractTests|KrakenContractTests|CoinbaseContractTests|HyperliquidKeyTests|HyperliquidSigningTests\\b|KrakenSigningTests|KrakenMaintenanceTests|CoinbaseSigningTests|\\.BinanceOHLCVClientTests\\b|\\.HyperliquidOHLCVClientTests\\b|\\.KrakenOHLCVClientTests\\b|\\.CoinbaseOHLCVClientTests\\b"

      # The identity PR's re-projection of the 2023 target (Tests/CryptoScraperTests/Behavioral/, its suites named
      # D<n>_…Tests, recorded answers only) runs here and is skipped by the network step, so it runs once.
      - name: Test the libraries' behavioral suites (classified reds disabled in place with their reason)
        run: swift test --filter "CryptoAssetTests|CryptoAssetLocalizationTests|CryptoExchangeTests|CryptoHyperliquidTests|CryptoKrakenTests|CryptoCoinbaseTests|CryptoOHLCVTests|CryptoReferenceTests|CryptoFearGreedTests|CryptoScraperTests\\.D[0-9]+_" --skip-build

      # The no-network suites of the 2023 CryptoScraper target, selected by suite name (every one ends NoNetworkTests),
      # gate the build like the libraries' steps.
      - name: Test the old target's no-network suites
        run: swift test --filter "NoNetworkTests" --skip-build

      # The network suites reach the chains' APIs with the secrets above and do not gate until the aggregators' token
      # counts are done and the Bitcoin explorer's rate limit is met; the Etherscan V2 work is done, and a chain V2
      # refuses to the key's plan, or does not serve, is skipped in V2's words. The no-network suites are skipped here,
      # so they run once.
      - name: Test the old aggregators (network)
        continue-on-error: true
        run: swift test --filter "CryptoScraperTests" --skip "NoNetworkTests|CryptoScraperTests\\.D[0-9]+_"

  # The device builds are CryptoAsset's alone: an app holds assets and amounts, but no app speaks to an exchange (AR49)
  # and only the services and the lab read bars, so the exchange library, the three plug-ins, the OHLCV library and
  # the reference library build and test on macOS and Linux only (the owner's word of 2026-10-06).
  build_apple_platforms:
    name: Build ${{ matrix.scheme }} for ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: ["CryptoAsset"]
        platform: ["iOS", "tvOS", "watchOS"]
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[67]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 or 27 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE"

      - name: Build
        run: >
          xcrun xcodebuild build
          -scheme ${{ matrix.scheme }}
          -destination "generic/platform=${{ matrix.platform }}"
          -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies"
          -derivedDataPath "$PWD/.derivedData"
          CODE_SIGNING_ALLOWED=NO
