name: CI

# The package is Swift tools 6.0, language mode 6 on its new libraries, with a floor of 26 on the Apple platforms, so the
# Apple jobs need the macOS 26 SDK: the newest Xcode 26 or 27 the macos-26 runner carries. The platforms list sets Apple floors only; Linux builds with a Swift 6 toolchain.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  COIN_MARKETCAP_KEY: ${{ secrets.COIN_MARKETCAP_KEY }}
  BTC_TEST_CONTRACT_ADDRESS: ${{ secrets.BTC_TEST_CONTRACT_ADDRESS }}
  ETHER_SCAN_KEY: ${{ secrets.ETHER_SCAN_KEY }}
  ETH_TEST_CONTRACT_ADDRESS: ${{ secrets.ETH_TEST_CONTRACT_ADDRESS }}
  FTM_SCAN_KEY: ${{ secrets.FTM_SCAN_KEY }}
  FTM_TEST_CONTRACT_ADDRESS: ${{ secrets.FTM_TEST_CONTRACT_ADDRESS }}
  BSC_SCAN_KEY: ${{ secrets.BSC_SCAN_KEY }}
  BSC_TEST_CONTRACT_ADDRESS: ${{ secrets.BSC_TEST_CONTRACT_ADDRESS }}
  POLYGON_SCAN_KEY: ${{ secrets.POLYGON_SCAN_KEY }}
  POLYGON_TEST_CONTRACT_ADDRESS: ${{ secrets.POLYGON_TEST_CONTRACT_ADDRESS }}
  OPTIMISTIC_ETHER_SCAN_KEY: ${{ secrets.OPTIMISTIC_ETHER_SCAN_KEY }}
  OPTIMISTIC_TEST_CONTRACT_ADDRESS: ${{ secrets.OPTIMISTIC_TEST_CONTRACT_ADDRESS }}
  TRON_TEST_CONTRACT_ADDRESS: ${{ secrets.TRON_TEST_CONTRACT_ADDRESS }}

jobs:
  test_linux:
    name: Test on Ubuntu, Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test the libraries (no network)
        run: swift test --filter "CryptoAssetTests|CryptoOHLCVTests|CryptoReferenceTests"

      - name: Test the old aggregators (network)
        continue-on-error: true
        run: swift test --filter "CryptoScraperTests"

  test_macos:
    name: Test on macOS 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[67]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 or 27 on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Build
        run: swift build

      # The three new libraries and their tests need no network: recorded responses only. The old CryptoScraper
      # target's tests reach the chains' APIs with the secrets above and are run separately so a network failure
      # there does not hide a library failure.
      - name: Test the libraries (no network)
        run: swift test --filter "CryptoAssetTests|CryptoOHLCVTests|CryptoReferenceTests"

      - name: Test the old aggregators (network)
        continue-on-error: true
        run: swift test --filter "CryptoScraperTests"

  build_apple_platforms:
    name: Build ${{ matrix.scheme }} for ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        scheme: ["CryptoAsset", "CryptoOHLCV", "CryptoReference"]
        platform: ["iOS", "tvOS", "watchOS"]
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[67]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 or 27 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE"

      - name: Build
        run: >
          xcrun xcodebuild build
          -scheme ${{ matrix.scheme }}
          -destination "generic/platform=${{ matrix.platform }}"
          -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies"
          -derivedDataPath "$PWD/.derivedData"
          CODE_SIGNING_ALLOWED=NO
